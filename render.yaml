services:
  # Unified Container: Node.js (Web + Sockets) & Python (Stockfish + Gemini)
  # Runs on 1 single Free instance to stay within Render's 750 free hours.
  - type: web
    name: chessyy
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
